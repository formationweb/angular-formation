<h1>Utilisateurs</h1>

<app-opacity  color="blue" (onChange)="listenOpacity($event)" />

<select [(ngModel)]="extSelected">
    <option value="">Tous</option>
    @for (ext of extensions() ; track ext) {
       <option>{{ ext }}</option> 
    } 
</select>

<input type="number" [(ngModel)]="index">
<button (click)="scrollToUser()">Scroll To User</button>
@if (error()) {
    <p>{{ error() }}</p>
}

<app-loader [loading]="loadingUser()">
    @for (u of usersFiltered() ; track u.id) {
       <div #userCardRef>
            <app-user-card [user]="u" (removeUser)="deleteUser($event)">
                <h1 entete>header</h1>
                <h2>footer</h2>
            </app-user-card>
       </div>
    }
</app-loader>
